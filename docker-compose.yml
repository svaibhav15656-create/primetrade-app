version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: primetrade_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: primetrade_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=1675a8b7e0ad0fba35b7dcc04ef065582c0feb9c0c8682a88942e1bbe69d7ce673c62d94a49b92fd392fc5a5abc6e02f44047eeb8ac0a4e9ac98761427b6750b
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/primetrade
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: primetrade_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
